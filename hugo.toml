# What the theme brings along. A site of its own wins over every value here.

[module]
  [module.hugoVersion]
    # Meta gives the coordinates and the moment a camera wrote into a photo
    min = "0.158.0"

[params]
  # gold | pink | teal
  accent = "gold"
  # Content width and edge length of the square cover
  column = "1280px"
  cover = "200px"

  # How a date reads, in Go's layout of 2 January 2006. Hugo puts the names in
  # the language of the page, and a language may set formats of its own under
  # its params.
  [params.dates]
    full = "Monday, 2 January 2006"
    long = "2 January 2006"
    short = "2 January"
    day = "2"

  [params.footer]
    # Hugo and the theme, named and linked at the end of the copyright line
    showThemeAttribution = true

  [params.map]
    # Width of the map column. The outlines fill it and derive their height
    width = "500px"
    # Pins on the map grow towards the middle zoom levels and shrink again
    # at full zoom. Both ends are also capped against the width of the map, so a
    # narrow column keeps them small whatever is written here.
    pin = 60
    pinmax = 100
    # How far the map lets you zoom in
    maxzoom = 18
    # OpenStreetMap: data under ODbL, tiles from the OSM Foundation.
    tiles = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
    darken = true
    # How far a photo may lie outside a boundary, as a share of the boundary's
    # size, for the map to draw that boundary
    [params.map.boundary]
      margin = 0.1

  # Where the pictures live. Left empty the theme takes the pictures lying
  # beside an entry and cuts the sizes itself.
  [params.photos]
    origin = ""
    sizes = ""

[outputFormats]
  [outputFormats.geojson]
    mediaType = "application/json"
    baseName = "map"
    isPlainText = true
