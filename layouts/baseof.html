<!doctype html>
<html lang="{{ site.Language.Locale }}"{{ with site.Language.Direction }} dir="{{ . }}"{{ end }}>
{{ partial "head.html" . }}
<body>
  <a class="skip" href="#content">{{ i18n "skip" }}</a>
  <div class="topband">
    {{ partial "header.html" . }}
    {{ block "hero" . }}{{ end }}
  </div>
  <main id="content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ range slice "js/nav.ts" "js/reveal.ts" }}{{ partial "module.html" . }}{{ end }}
</body>
</html>
