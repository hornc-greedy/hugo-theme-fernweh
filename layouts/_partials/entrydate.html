{{- /* The date of an entry: one day, or a span when the front matter carries
       an until date. */ -}}
{{- $from := .Date -}}
{{- with .Params.until -}}
  {{ partial "span.html" (dict "from" $from "to" .) }}
{{- else -}}
  <time datetime="{{ dateFormat "2006-01-02" $from }}">{{ dateFormat site.Params.dates.full $from }}</time>
{{- end -}}
