# Started from the root of the theme, naming the folder it was cloned into:
#   hugo server --source exampleSite --themesDir ../.. --theme hugo-theme-fernweh

baseURL = "https://example.com/"
title = "Fernweh"
theme = "fernweh"

defaultContentLanguage = "en"
timeZone = "Europe/Berlin"
disableKinds = ["taxonomy", "term"]

[languages.en]
  label = "English"
  locale = "en-GB"
  weight = 1
  [languages.en.params.dates]
    full = "Monday, 2 January 2006"
    long = "2 January 2006"
    short = "2 January"
    day = "2"

[languages.de]
  label = "Deutsch"
  locale = "de-DE"
  weight = 2
  [languages.de.params.dates]
    full = "Monday, 2. January 2006"
    long = "2. January 2006"
    short = "2. January"
    day = "2."

# The map is drawn from the coordinates the cameras wrote into the photos, and
# Hugo leaves GPS out of its metadata unless it is asked for.
[imaging.meta]
  fields = ["GPS*", "Date*"]

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
